<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="fwt fwd" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="fwt">Demo2Sim2Target framework</title>
<desc id="fwd">A human gives a demonstration video, a task with its deployment scenario, and the hand specification. An autonomous research agent reconstructs the demonstration, writes its own criteria, builds its own simulator, trains a deployable policy with PPO and verifies it (Demo2Sim). It delivers the policy to a held-out target simulator with hidden physics and new starts; the target's measurements are the official result, and its evidence returns to the agent (Sim2Target).</desc>
<defs>
<style>
.bg{fill:var(--bg,#ffffff)}
.inbox{fill:var(--soft,#eef3fa);stroke:var(--line,#d5ddea);stroke-width:1.2}
.agbox{fill:var(--agentbg,#f0eafb);stroke:var(--agent,#5b3a9e);stroke-width:1.6}
.tgbox{fill:var(--tgtbg,#e6f3ea);stroke:var(--tgt,#1f6f3f);stroke-width:1.6}
.node{fill:var(--card,#ffffff);stroke:var(--agent,#5b3a9e);stroke-width:1.2}
.tnode{fill:var(--card,#ffffff);stroke:var(--tgt,#1f6f3f);stroke-width:1.2}
.inode{fill:var(--card,#ffffff);stroke:var(--line,#c9d3e3);stroke-width:1.1}
.h{font-size:18px;font-weight:750;fill:var(--navy,#0b2a55)}
.hs{font-size:12.5px;fill:var(--muted,#55627a)}
.n{font-size:14.5px;font-weight:700;fill:var(--navy,#0b2a55)}
.ns{font-size:11.5px;fill:var(--muted,#55627a)}
.num{font-size:11px;font-weight:700;fill:var(--agent,#5b3a9e)}
.lab{font-size:13px;font-weight:650;fill:var(--fg,#1c2433)}
.labs{font-size:11.5px;fill:var(--muted,#55627a)}
.ag{fill:var(--agent,#5b3a9e)}.tg{fill:var(--tgt,#1f6f3f)}
.ar{fill:none;stroke:var(--fg,#1c2433);stroke-width:1.6}
.arp{fill:none;stroke:var(--agent,#5b3a9e);stroke-width:1.5}
.art{fill:none;stroke:var(--tgt,#1f6f3f);stroke-width:1.8}
.br{fill:none;stroke:var(--muted,#55627a);stroke-width:1.3}
.brl{font-size:13px;font-weight:750;letter-spacing:.06em;fill:var(--navy,#0b2a55)}
.ic{fill:none;stroke:var(--muted,#55627a);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--fg,#1c2433)"/></marker>
<marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--agent,#5b3a9e)"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--tgt,#1f6f3f)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1200" height="480"/>

<!-- human input -->
<rect class="inbox" x="16" y="56" width="196" height="318" rx="14"/>
<text class="h" x="32" y="86">Human</text>
<text class="hs" x="32" y="104">what is wanted</text>
<rect class="inode" x="30" y="120" width="168" height="72" rx="10"/>
<rect class="ic" x="44" y="138" width="34" height="26" rx="4"/><path d="M57,145 L57,157 L67,151 z" style="fill:var(--muted,#55627a)"/>
<text class="n" x="88" y="150">Demo video</text><text class="ns" x="88" y="167">one example</text>
<rect class="inode" x="30" y="204" width="168" height="72" rx="10"/>
<path class="ic" d="M46,222 h22 l8,8 v26 h-30 z M68,222 v8 h8 M52,238 h18 M52,246 h18"/>
<text class="n" x="88" y="234">Task</text><text class="ns" x="88" y="251">goal + deployment</text>
<rect class="inode" x="30" y="288" width="168" height="72" rx="10"/>
<rect class="ic" x="44" y="306" width="34" height="38" rx="4"/><path class="ic" d="M50,316 h22 M50,324 h22 M50,332 h14"/><circle class="ic" cx="70" cy="334" r="3"/>
<text class="n" x="88" y="318">Hand spec</text><text class="ns" x="88" y="335">hardware limits</text>
<path class="ar" d="M212,215 L244,215" marker-end="url(#ah)"/>

<!-- agent -->
<rect class="agbox" x="250" y="30" width="640" height="370" rx="18"/>
<text class="h" x="272" y="62">Research agent</text>
<text class="hs" x="272" y="81">autonomous coding agent · its own simulator · fixed time budget</text>
<g>
<rect class="node" x="270" y="120" width="108" height="86" rx="11"/><text class="num" x="282" y="140">1</text>
<text class="n" x="282" y="166">Reconstruct</text><text class="ns" x="282" y="184">hand · objects</text><text class="ns" x="282" y="198">from the video</text>
<rect class="node" x="394" y="120" width="108" height="86" rx="11"/><text class="num" x="406" y="140">2</text>
<text class="n" x="406" y="166">Criteria</text><text class="ns" x="406" y="184">goal + skill,</text><text class="ns" x="406" y="198">measured</text>
<rect class="node" x="518" y="120" width="108" height="86" rx="11"/><text class="num" x="530" y="140">3</text>
<text class="n" x="530" y="166">Simulation</text><text class="ns" x="530" y="184">scene · physics</text><text class="ns" x="530" y="198">· randomization</text>
<rect class="node" x="642" y="120" width="108" height="86" rx="11"/><text class="num" x="654" y="140">4</text>
<text class="n" x="654" y="166">PPO</text><text class="ns" x="654" y="184">deployable</text><text class="ns" x="654" y="198">observations</text>
<rect class="node" x="766" y="120" width="108" height="86" rx="11"/><text class="num" x="778" y="140">5</text>
<text class="n" x="778" y="166">Self-verify</text><text class="ns" x="778" y="184">own criteria,</text><text class="ns" x="778" y="198">many starts</text>
</g>
<path class="arp" d="M378,163 L390,163" marker-end="url(#ahp)"/>
<path class="arp" d="M502,163 L514,163" marker-end="url(#ahp)"/>
<path class="arp" d="M626,163 L638,163" marker-end="url(#ahp)"/>
<path class="arp" d="M750,163 L762,163" marker-end="url(#ahp)"/>
<path class="arp" d="M820,206 C820,262 572,262 572,212" marker-end="url(#ahp)"/>
<text class="labs" x="696" y="276" text-anchor="middle">iterate: diagnose → change simulation, reward → retrain</text>
<rect x="270" y="300" width="604" height="78" rx="11" style="fill:var(--card,#ffffff);stroke:var(--agent,#5b3a9e);stroke-width:1;stroke-dasharray:4 4"/>
<text class="n" x="288" y="328">Records</text>
<text class="ns" x="288" y="347">every reconstruction, criteria version, simulation, iteration, verification and judgment</text>
<text class="ns" x="288" y="363">is recorded as it happens — the agent's own account, shown live on this site</text>

<!-- delivery and feedback -->
<path class="ar" d="M890,150 L1000,150" marker-end="url(#ah)"/>
<text class="lab" x="945" y="138" text-anchor="middle">policy</text>
<text class="labs" x="945" y="168" text-anchor="middle">+ start pose</text>
<path class="art" d="M1000,262 L890,262" marker-end="url(#aht)"/>
<text class="lab" x="945" y="250" text-anchor="middle" style="fill:var(--tgt,#1f6f3f)">evidence</text>
<text class="labs" x="945" y="280" text-anchor="middle">videos · state logs</text>
<text class="labs" x="945" y="295" text-anchor="middle">→ calibrate, judge</text>

<!-- target -->
<rect class="tgbox" x="1004" y="56" width="180" height="318" rx="14"/>
<text class="h" x="1020" y="86">Target</text>
<text class="hs" x="1020" y="104">held-out simulator</text>
<rect class="tnode" x="1018" y="120" width="152" height="54" rx="10"/><text class="n" x="1030" y="143">Hidden physics</text><text class="ns" x="1030" y="160">never shown to the agent</text>
<rect class="tnode" x="1018" y="184" width="152" height="54" rx="10"/><text class="n" x="1030" y="207">New starts</text><text class="ns" x="1030" y="224">seeded, per trial</text>
<rect class="tnode" x="1018" y="248" width="152" height="54" rx="10"/><text class="n" x="1030" y="271">Official result</text><text class="ns" x="1030" y="288">progress · success</text>
<text class="labs" x="1094" y="330" text-anchor="middle">measured by the target,</text>
<text class="labs" x="1094" y="346" text-anchor="middle">not by the agent</text>

<!-- scope brackets -->
<path class="br" d="M250,414 v8 h640 v-8"/>
<text class="brl" x="570" y="442" text-anchor="middle">DEMO2SIM</text>
<path class="br" d="M250,452 v8 h934 v-8"/>
<text class="brl" x="717" y="476" text-anchor="middle">DEMO2SIM2TARGET  =  DEMO2SIM  +  SIM2TARGET</text>
</svg>
