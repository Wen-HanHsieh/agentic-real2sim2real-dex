<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1440 600' width='1440' height='600' role='img' aria-labelledby='fw-title fw-desc' class='fw-svg'>
<title id='fw-title'>Framework: agentic real-to-sim-to-real dexterous learning</title>
<desc id='fw-desc'>A fixed task specification (demonstration video, task description, success criteria, robot and object specifications)
is given to an autonomous research agent. The agent builds and modifies its own training simulator, reward and training recipe, and
policy, and submits each policy to a black-box target, which executes it and scores the rollout against the fixed success criteria.
The target returns observable feedback only: the score, multi-view RGB-D video, sensor-estimated object tracks, joint and action logs,
and hardware diagnostics. Its physics, ground-truth state and verifier internals stay hidden. The agent diagnoses the result, improves
its simulator, reward or policy, and repeats.</desc>
<defs>
<style>
.fw-svg{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.fw-svg text{fill:var(--fg,#111316)}
.fw-zone-h{fill:var(--soft,#f2f1ed)}.fw-zone-a{fill:var(--agentbg,#f0eafb)}.fw-zone-t{fill:var(--tgtbg,#e6f3ea)}
.fw-panel,.fw-card{fill:var(--card,#ffffff);stroke:var(--line,#e4e3de);stroke-width:1.2}
.fw-card-h{stroke:var(--muted,#5f646c);stroke-width:1.3}.fw-card-a{stroke:var(--agent,#5b3a9e);stroke-width:1.5}.fw-card-t{stroke:var(--tgt,#1f6f3f);stroke-width:1.5}
.fw-inner{fill:var(--card,#ffffff);opacity:.45;stroke:none}
.fw-svg .fw-h{font-size:16px;font-weight:800;letter-spacing:.07em}.fw-svg .fw-hs{font-size:13px;fill:var(--muted,#5f646c)}
.fw-svg .fw-h-h{fill:var(--muted,#5f646c)}.fw-svg .fw-h-a{fill:var(--agent,#5b3a9e)}.fw-svg .fw-h-t{fill:var(--tgt,#1f6f3f)}
.fw-svg .fw-gt{font-size:14px;font-weight:700;fill:var(--agent,#5b3a9e)}
.fw-svg .fw-ct{font-size:15px;font-weight:700}.fw-svg .fw-cs{font-size:12.5px;fill:var(--muted,#5f646c)}
.fw-svg .fw-lab{font-size:13px;font-weight:700}.fw-svg .fw-lab-a{fill:var(--agent,#5b3a9e)}.fw-svg .fw-lab-t{fill:var(--tgt,#1f6f3f)}.fw-svg .fw-lab-h{fill:var(--muted,#5f646c)}
.fw-svg .fw-note{font-size:12.5px;font-style:italic;fill:var(--muted,#5f646c)}
.fw-svg .fw-leg{font-size:12.5px;fill:var(--muted,#5f646c)}
.fw-ar-h{fill:none;stroke:var(--muted,#5f646c);stroke-width:2.2}
.fw-ar-a{fill:none;stroke:var(--agent,#5b3a9e);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.fw-ar-t{fill:none;stroke:var(--tgt,#1f6f3f);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.fw-mk-h{fill:var(--muted,#5f646c)}.fw-mk-a{fill:var(--agent,#5b3a9e)}.fw-mk-t{fill:var(--tgt,#1f6f3f)}
.fw-lock{color:var(--muted,#5f646c)}.fw-lock-t{color:var(--tgt,#1f6f3f)}
.fw-sw{stroke:var(--line,#e4e3de);stroke-width:1}
</style>
<symbol id='fw-lock' viewBox='0 0 14 16' width='13' height='15'><path d='M3.5 7V4.8a3.5 3.5 0 0 1 7 0V7' fill='none' stroke='currentColor' stroke-width='1.8'/>
<rect x='1' y='7' width='12' height='8.5' rx='2' fill='currentColor'/></symbol>
<marker id='fw-mh' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' class='fw-mk-h'/></marker>
<marker id='fw-ma' viewBox='0 0 10 10' refX='7' refY='5' markerWidth='4' markerHeight='4' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' class='fw-mk-a'/></marker>
<marker id='fw-mt' viewBox='0 0 10 10' refX='7' refY='5' markerWidth='4' markerHeight='4' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' class='fw-mk-t'/></marker>
</defs>
<g id='task-spec'>
<rect class='fw-zone-h' x='24' y='40' width='276' height='480' rx='18'/>
<text class='fw-h fw-h-h' x='44' y='76'>TASK SPECIFICATION</text>
<text class='fw-hs' x='44' y='96'>human-defined · fixed</text>
<use href='#fw-lock' x='269' y='62' class='fw-lock'/>
<rect class='fw-card fw-card-h' x='44' y='130' width='236' height='70' rx='10'/>
<text class='fw-ct' x='60' y='162.5'>Demonstration video</text>
<text class='fw-cs' x='60' y='179.5'>reference, not a motion target</text>
<rect class='fw-card fw-card-h' x='44' y='212' width='236' height='70' rx='10'/>
<text class='fw-ct' x='60' y='244.5'>Task description</text>
<text class='fw-cs' x='60' y='261.5'>natural language</text>
<rect class='fw-card fw-card-h' x='44' y='294' width='236' height='70' rx='10'/>
<text class='fw-ct' x='60' y='326.5'>Success criteria</text>
<text class='fw-cs' x='60' y='343.5'>official evaluation rubric</text>
<rect class='fw-card fw-card-h' x='44' y='376' width='236' height='70' rx='10'/>
<text class='fw-ct' x='60' y='408.5'>Robot &amp; object specs</text>
<text class='fw-cs' x='60' y='425.5'>URDF, hardware limits, geometry</text>
</g>
<g id='agent'>
<rect class='fw-zone-a' x='348' y='40' width='664' height='480' rx='18'/>
<text class='fw-h fw-h-a' x='368' y='76'>AUTONOMOUS RESEARCH AGENT</text>
<text class='fw-hs' x='368' y='96'>builds, trains, submits, diagnoses, improves</text>
<rect class='fw-inner' x='368' y='118' width='624' height='182' rx='14'/>
<text class='fw-gt' x='388' y='146'>Simulation &amp; policy learning</text>
<rect class='fw-card fw-card-a' x='388' y='166' width='185' height='116' rx='10'/>
<text class='fw-ct' x='404' y='213.5'>Training simulator</text>
<text class='fw-cs' x='404' y='230.5'><tspan x='404' dy='0'>geometry · physics</tspan><tspan x='404' dy='16'>contacts · actuation</tspan></text>
<rect class='fw-card fw-card-a' x='587' y='166' width='185' height='116' rx='10'/>
<text class='fw-ct' x='603' y='213.5'>Reward &amp; recipe</text>
<text class='fw-cs' x='603' y='230.5'><tspan x='603' dy='0'>agent-designed, not the</tspan><tspan x='603' dy='16'>target score</tspan></text>
<rect class='fw-card fw-card-a' x='786' y='166' width='185' height='116' rx='10'/>
<text class='fw-ct' x='802' y='213.5'>Policy π<tspan dy='3' style='font-size:.72em'>k</tspan><tspan dy='-3'> </tspan></text>
<text class='fw-cs' x='802' y='230.5'><tspan x='802' dy='0'>joint-only observations</tspan><tspan x='802' dy='16'>trained in simulation</tspan></text>
<rect class='fw-card fw-card-a' x='388' y='366' width='604' height='104' rx='10'/>
<text class='fw-ct' x='404' y='407.5'>Diagnose &amp; improve</text>
<text class='fw-cs' x='404' y='424.5'><tspan x='404' dy='0'>compare the target rollout with the simulation · form a hypothesis</tspan><tspan x='404' dy='16'>change simulator, reward or policy · retrain · resubmit</tspan></text>
<path class='fw-ar-a' d='M 680 366 L 680 318' marker-end='url(#fw-ma)'/>
<text class='fw-lab fw-lab-a' x='692' y='338'>iteration k → k+1</text>
</g>
<g id='target'>
<rect class='fw-zone-t' x='1040' y='40' width='376' height='480' rx='18'/>
<text class='fw-h fw-h-t' x='1060' y='76'>BLACK-BOX TARGET</text>
<text class='fw-hs' x='1060' y='96'>fixed · internals hidden</text>
<use href='#fw-lock' x='1385' y='62' class='fw-lock-t'/>
<rect class='fw-card fw-card-t' x='1060' y='190' width='336' height='68' rx='10'/>
<text class='fw-ct' x='1076' y='221.5'>Target robot executes π<tspan dy='3' style='font-size:.72em'>k</tspan><tspan dy='-3'> </tspan></text>
<text class='fw-cs' x='1076' y='238.5'>one rollout per submission</text>
<path class='fw-ar-t' d='M 1228 258 L 1228 272' marker-end='url(#fw-mt)'/>
<rect class='fw-card fw-card-t' x='1060' y='276' width='336' height='68' rx='10'/>
<text class='fw-ct' x='1076' y='307.5'>Verifier scores the rollout</text>
<text class='fw-cs' x='1076' y='324.5'>fixed success criteria, from sensors only</text>
<rect class='fw-card fw-card-t' x='1060' y='366' width='336' height='104' rx='10'/>
<text class='fw-ct' x='1076' y='399.5'>Observable feedback</text>
<text class='fw-cs' x='1076' y='416.5'><tspan x='1076' dy='0'>success &amp; score · multi-view RGB-D video</tspan><tspan x='1076' dy='16'>sensor-estimated object tracks</tspan><tspan x='1076' dy='16'>joint &amp; action logs · hardware diagnostics</tspan></text>
<use href='#fw-lock' x='1060' y='490' class='fw-lock-t'/>
<text class='fw-note' x='1080' y='502'>hidden: physics, ground-truth state, verifier internals</text>
</g>
<g id='flow'>
<path class='fw-ar-h' d='M 300 224 L 340 224' marker-end='url(#fw-mh)'/>
<path class='fw-ar-a' d='M 973 224 L 1052 224' marker-end='url(#fw-ma)'/>
<text class='fw-lab fw-lab-a' x='1012' y='212' text-anchor='middle'>submit π<tspan dy='3' style='font-size:.72em'>k</tspan><tspan dy='-3'> </tspan></text>
<path class='fw-ar-t' d='M 1060 418 L 1000 418' marker-end='url(#fw-mt)'/>
<text class='fw-lab fw-lab-t' x='1026' y='440' text-anchor='middle'>feedback</text>
</g>
<g id='legend'>
<rect class='fw-zone-h fw-sw' x='24' y='555' width='22' height='14' rx='4'/>
<text class='fw-leg' x='54' y='566'>Human-defined, fixed</text>
<rect class='fw-zone-a fw-sw' x='214.0' y='555' width='22' height='14' rx='4'/>
<text class='fw-leg' x='244.0' y='566'>Agent-modifiable</text>
<rect class='fw-zone-t fw-sw' x='377.2' y='555' width='22' height='14' rx='4'/>
<text class='fw-leg' x='407.2' y='566'>Target: fixed, internals hidden</text>
<use href='#fw-lock' x='640.9000000000001' y='554' class='fw-lock'/>
<text class='fw-leg' x='660.9000000000001' y='566'>not accessible to the agent</text>
</g>
</svg>
